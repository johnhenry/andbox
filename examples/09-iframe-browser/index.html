<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>andbox — iframe mode (running)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .pane { border: 1px solid #ccc; border-radius: 6px; margin: 1rem 0; }
    .pane iframe { display: block; width: 100%; height: 160px; border: 0; }
    pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>andbox — <code>iframe</code> mode</h1>
  <p>Two notebook-style panes. Each runs its code in a sandboxed, opaque-origin
  <code>&lt;iframe&gt;</code> and renders into that frame's own document.
  Status: <strong id="status">running</strong></p>
  <div class="pane" id="chart-pane"></div>
  <div class="pane" id="clock-pane"></div>
  <pre id="result"></pre>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
