<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>andbox — Chrome AI bridge (running)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    #consent { display: none; border: 1px solid #c90; background: #fff8e6; padding: .75rem; border-radius: 6px; }
    #consent.open { display: block; }
    pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>andbox — Chrome AI bridge</h1>
  <p>Code in a sandboxed Worker uses Chrome's on-device model through the page.
  The Worker has no <code>LanguageModel</code> of its own; the page owns the session and asks you first.
  Status: <strong id="status">running</strong></p>
  <div id="consent">
    <p id="consent-text"></p>
    <button id="allow">Allow</button> <button id="deny">Deny</button>
  </div>
  <p>Model: <span id="source"></span> · download: <progress id="progress" max="1" value="0"></progress></p>
  <pre id="output"></pre>
  <pre id="result"></pre>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
